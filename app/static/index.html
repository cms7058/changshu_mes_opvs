<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><title>MES 运维智能体</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
:root{--blue:#2563eb;--blue-soft:#dbeafe;--ink:#1f2937;--muted:#6b7280;--bg:#f5f7fa;--line:#dde3ec;--green:#16a34a;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:#1e3a8a;color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:700}
.brand small{display:block;font-size:11px;opacity:.7;font-weight:400;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:12px 0}
.nav-item{padding:10px 20px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.active{background:rgba(255,255,255,.15);border-left:3px solid #fff;padding-left:17px}
.nav-section{padding:14px 20px 4px;font-size:11px;text-transform:uppercase;opacity:.6;letter-spacing:.5px}
.user{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.user a{color:#fff;opacity:.8;text-decoration:none;font-size:11px}
.user a:hover{opacity:1}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
h1{margin:0 0 16px;font-size:22px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:8px}
.crumb a{color:var(--blue);cursor:pointer}
.page{flex:1;overflow-y:auto;padding:24px 32px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 14px;background:var(--blue);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{background:#1d4ed8}
.btn-sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-sec:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm{padding:4px 10px;font-size:12px}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit}
textarea{width:100%;min-height:60px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:13px}
table th,table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table th{background:#f8fafc;color:var(--muted);font-weight:600;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.admin{background:#fef3c7;color:#92400e}
.badge.engineer{background:#dbeafe;color:#1e40af}
.badge.viewer{background:#e2e8f0;color:#475569}
.badge.pending{background:#fef3c7;color:#92400e}
.badge.done{background:#dcfce7;color:#166534}
.badge.failed{background:#fee2e2;color:#991b1b}
.badge.unsupported{background:#e2e8f0;color:#475569}
.muted{color:var(--muted)}

/* Workspace: split layout */
.workspace{flex:1;display:flex;overflow:hidden;height:100%}
.docs-pane{width:380px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;flex-shrink:0}
.chat-pane{flex:1;display:flex;flex-direction:column;background:#f5f7fa;overflow:hidden}
.pane-head{padding:14px 18px;border-bottom:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.pane-head h2{margin:0;font-size:14px}
.pane-body{flex:1;overflow-y:auto;padding:12px}
.doc-row{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:#fff;transition:all .15s}
.doc-row:hover{border-color:var(--blue)}
.doc-row.selected{background:#eff6ff;border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.doc-row .name{font-weight:600;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.doc-row .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.doc-row .acts{display:flex;gap:8px;margin-top:6px;font-size:11px}
.doc-row .acts a{color:var(--blue);cursor:pointer}
.doc-row .acts a.danger{color:var(--red)}
.selection-bar{padding:10px 18px;background:#eff6ff;border-top:1px solid var(--line);font-size:12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.selection-bar b{color:var(--blue)}

/* Chat */
.chat-head{padding:14px 18px;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0}
.chat-head h2{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.chat-head .actions{display:flex;gap:6px}

/* History drawer */
.hist-drawer{position:absolute;top:0;right:0;width:320px;height:100%;background:#fff;border-left:1px solid var(--line);display:none;flex-direction:column;z-index:10;box-shadow:-4px 0 12px rgba(0,0,0,.05)}
.hist-drawer.open{display:flex}
.hist-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.hist-list{flex:1;overflow-y:auto;padding:8px}
.hist-row{padding:10px 12px;border-radius:6px;cursor:pointer;margin-bottom:4px;font-size:13px;border:1px solid transparent}
.hist-row:hover{background:#f8fafc;border-color:var(--line)}
.hist-row.current{background:#eff6ff;border-color:var(--blue)}
.hist-row .title{font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-row .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.hist-row .acts{margin-top:4px;display:none;gap:8px;font-size:11px}
.hist-row:hover .acts{display:flex}
.hist-row .acts a{color:var(--blue);cursor:pointer}
.hist-row .acts a.danger{color:var(--red)}

.streaming-cursor::after{content:"▊";animation:blink 1s steps(2) infinite;color:var(--blue);font-weight:normal;margin-left:1px}
@keyframes blink{50%{opacity:0}}

/* Tabs in workspace */
.tabs-bar{display:flex;gap:4px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
.tab-btn{padding:6px 14px;border-radius:6px 6px 0 0;background:transparent;border:none;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tab-btn:hover{color:var(--blue)}
.pane-content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* Issues view */
.issues-toolbar{padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex-shrink:0}
.issues-stats{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-right:auto}
.issues-stats b{color:var(--ink);font-size:14px}
.issues-body{flex:1;overflow-y:auto;padding:16px 18px}
.cat-section{margin-bottom:18px}
.cat-section h3{margin:0 0 8px;font-size:14px;color:#1e40af;border-left:3px solid var(--blue);padding-left:8px}
.issue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.issue-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .15s;position:relative}
.issue-card:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(37,99,235,.08)}
.issue-card .code{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.5px}
.issue-card .title{font-weight:600;margin:4px 0;font-size:13.5px;line-height:1.4}
.issue-card .desc{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.issue-card .badges{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.severity-high{background:#fee2e2;color:#991b1b}
.severity-mid{background:#fef3c7;color:#92400e}
.severity-low{background:#dcfce7;color:#166534}
.status-ai_draft{background:#e9d5ff;color:#6b21a8}
.status-open{background:#dbeafe;color:#1e40af}
.status-approved{background:#dcfce7;color:#166534}
.status-closed{background:#e2e8f0;color:#475569}
.empty-issues{padding:60px 20px;text-align:center;color:var(--muted)}
.empty-issues h3{margin:0 0 8px;color:#374151}

/* Mermaid diagram blocks */
.mermaid-wrap{margin:10px 0;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.mermaid-svg{padding:14px;text-align:center;overflow-x:auto}
.mermaid-svg svg{max-width:100%;height:auto}
.mermaid-actions{padding:8px 14px;background:#f8fafc;border-top:1px solid var(--line);display:flex;gap:14px;font-size:11px}
.mermaid-actions a{color:var(--blue);cursor:pointer}
.mermaid-actions a:hover{text-decoration:underline}
.mermaid-error{padding:12px 16px;background:#fef2f2;color:#991b1b;font-size:12px;font-family:monospace;white-space:pre-wrap;border-radius:6px;margin:8px 0}
.mermaid-error code{background:#fee2e2;padding:1px 4px;border-radius:3px}
.chat-msgs{flex:1;overflow-y:auto;padding:16px 24px}
.welcome{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 28px;max-width:760px;margin:20px auto}
.welcome h3{margin:0 0 8px;font-size:16px}
.welcome p{margin:6px 0;color:var(--muted);font-size:13px}
.welcome .step{padding:8px 12px;background:#f8fafc;border-left:3px solid var(--blue);margin:8px 0;border-radius:0 6px 6px 0;font-size:13px}
.prompt-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:8px 14px;background:#fff;border:1px solid var(--blue);color:var(--blue);border-radius:18px;cursor:pointer;font-size:12px;transition:all .15s}
.chip:hover{background:var(--blue);color:#fff}
.msg{margin-bottom:14px;display:flex;gap:10px;max-width:100%}
.msg .av{width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.msg.user .av{background:#fef3c7;color:#92400e}
.msg .bubble{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;max-width:80%;line-height:1.7;overflow-x:auto}
.msg.user .bubble{background:#fef9e7;white-space:pre-wrap}
.msg.assistant .bubble{font-size:13.5px}
/* Markdown rendering inside chat bubble */
.msg.assistant .bubble h1{font-size:18px;margin:14px 0 8px;border-bottom:1px solid #e5e7eb;padding-bottom:4px}
.msg.assistant .bubble h2{font-size:15px;margin:12px 0 6px;color:#1e40af}
.msg.assistant .bubble h3{font-size:14px;margin:10px 0 4px;color:#334155}
.msg.assistant .bubble p{margin:6px 0}
.msg.assistant .bubble ul,.msg.assistant .bubble ol{margin:6px 0;padding-left:24px}
.msg.assistant .bubble li{margin:2px 0}
.msg.assistant .bubble strong{color:#1e40af}
.msg.assistant .bubble code{background:#f1f5f9;padding:1px 5px;border-radius:3px;font-size:12px;font-family:'SF Mono',Consolas,monospace}
.msg.assistant .bubble pre{background:#1e293b;color:#e2e8f0;padding:10px 14px;border-radius:6px;overflow-x:auto;font-size:12px;margin:8px 0}
.msg.assistant .bubble pre code{background:transparent;color:inherit;padding:0}
.msg.assistant .bubble blockquote{border-left:3px solid #cbd5e1;padding:4px 12px;color:#475569;margin:8px 0;background:#f8fafc}
.msg.assistant .bubble table{border-collapse:collapse;font-size:12px;margin:8px 0;width:100%}
.msg.assistant .bubble th,.msg.assistant .bubble td{border:1px solid #cbd5e1;padding:5px 8px;text-align:left}
.msg.assistant .bubble th{background:#f1f5f9;font-weight:600}
.msg .refs{font-size:11px;color:var(--blue);margin-top:6px;padding-top:6px;border-top:1px dashed #e5e7eb}
.msg-actions{margin-top:8px;padding-top:6px;border-top:1px dashed #e5e7eb;display:flex;gap:10px;font-size:11px}
.msg-actions a{color:var(--blue);cursor:pointer}
.msg-actions a:hover{text-decoration:underline}
.chat-input-wrap{padding:14px 24px;background:#fff;border-top:1px solid var(--line);flex-shrink:0}
.chat-input{display:flex;gap:10px}
.chat-input textarea{flex:1;min-height:44px;max-height:200px}

/* Modal */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:10px;padding:24px 28px;width:480px;max-width:90vw;max-height:88vh;overflow-y:auto}
.modal h3{margin:0 0 14px;font-size:16px}
.modal.wide{width:900px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:#374151;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%}
.error{color:var(--red);font-size:12px;margin-top:6px}

/* Preview iframe */
.preview-frame{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">MES 运维智能体<small id="userInfo">加载中…</small></div>
  <div class="nav">
    <div class="nav-section">工作区</div>
    <div class="nav-item active" data-view="projects">📁 项目空间</div>
    <div class="nav-section" id="adminSection" style="display:none">管理</div>
    <div class="nav-item" data-view="users" id="usersNav" style="display:none">👥 用户管理</div>
    <div class="nav-item" data-view="health" id="healthNav" style="display:none">🩺 系统状态</div>
  </div>
  <div class="user">
    <span id="username">—</span>
    <a href="#" onclick="logout()">退出</a>
  </div>
</div>

<div class="main" id="main">加载中…</div>

<div class="modal-mask" id="modal">
  <div class="modal" id="modalBox">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const token = localStorage.getItem('token');
if(!token){ location.href = '/login'; }
const user = JSON.parse(localStorage.getItem('user')||'{}');
document.getElementById('username').textContent = user.full_name || user.username || '—';
document.getElementById('userInfo').textContent = `${user.username} · ${user.role}`;
if(user.role === 'admin'){
  document.getElementById('adminSection').style.display='block';
  document.getElementById('usersNav').style.display='block';
  document.getElementById('healthNav').style.display='block';
}

let currentProject = null;
let currentSession = null;
let docPollInterval = null;
const selectedDocs = new Set();

async function api(path, opts={}){
  opts.headers = Object.assign({'Authorization':'Bearer '+token}, opts.headers||{});
  const r = await fetch(path, opts);
  if(r.status === 401){ logout(); return; }
  if(!r.ok){ const j=await r.json().catch(()=>({detail:r.statusText})); throw new Error(j.detail||'请求失败'); }
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : r.text();
}
function logout(){ localStorage.clear(); location.href='/login'; }

document.querySelectorAll('.nav-item').forEach(el=>{
  el.onclick = ()=>{
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    el.classList.add('active');
    if(docPollInterval){ clearInterval(docPollInterval); docPollInterval = null; }
    render(el.dataset.view);
  };
});

function openModal(title, html, wide=false){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBox').classList.toggle('wide', wide);
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };

/* ============ Projects list ============ */
async function viewProjects(){
  currentProject = null; selectedDocs.clear(); currentSession = null;
  const main = document.getElementById('main');
  main.innerHTML = `<div class="page">
    <h1>项目空间</h1>
    <p class="muted" style="margin-bottom:14px">点击"进入"打开项目工作区，里面包含文档管理与 AI 对话。</p>
    <div class="row" style="margin-bottom:14px">
      <button class="btn" onclick="newProject()">+ 新建项目</button>
    </div>
    <div class="card"><table><thead><tr><th>ID</th><th>项目名</th><th>客户</th><th>说明</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="projTbody"></tbody></table></div>
  </div>`;
  try{
    const list = await api('/api/projects');
    document.getElementById('projTbody').innerHTML = list.map(p=>`
      <tr><td>${p.id}</td><td><b>${p.name}</b></td><td>${p.customer||'-'}</td>
        <td class="muted">${p.description||'-'}</td>
        <td class="muted">${new Date(p.created_at).toLocaleString()}</td>
        <td><button class="btn btn-sm" onclick="enterProject(${p.id},'${(p.name||'').replace(/'/g,"")}')">进入 →</button></td></tr>
    `).join('') || '<tr><td colspan="6" class="muted">暂无项目，点击上方按钮新建</td></tr>';
  }catch(e){ main.innerHTML += '<div class="error">'+e.message+'</div>'; }
}
function newProject(){
  openModal('新建项目', `
    <div class="field"><label>项目名 *</label><input id="np_name" placeholder="例：常熟基地 WMS"></div>
    <div class="field"><label>客户</label><input id="np_customer" placeholder="例：华域视觉"></div>
    <div class="field"><label>说明</label><textarea id="np_desc"></textarea></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn btn-sec" onclick="closeModal()">取消</button>
      <button class="btn" onclick="submitProject()">创建</button>
    </div>`);
}
async function submitProject(){
  try{
    await api('/api/projects', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:np_name.value, customer:np_customer.value, description:np_desc.value})});
    closeModal(); viewProjects();
  }catch(e){ alert(e.message); }
}
function enterProject(id, name){
  currentProject = {id, name};
  renderWorkspace();
}

/* ============ Workspace (docs + chat) ============ */
function renderWorkspace(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="workspace">
      <!-- Left: documents -->
      <div class="docs-pane">
        <div class="pane-head">
          <h2>📄 文档（${currentProject.name}）</h2>
          <div style="display:flex;gap:6px">
            <button class="btn btn-sec btn-sm" onclick="reparseAll()" title="重新解析全部未完成的文档">🔄 全部解析</button>
            <button class="btn btn-sm" onclick="openUpload()">+ 上传</button>
          </div>
        </div>
        <div class="pane-body" id="docsList">加载中…</div>
        <div class="selection-bar">
          <span>已选 <b id="selCount">0</b> 份作为对话上下文</span>
          <a onclick="selectedDocs.clear();refreshDocs()" style="color:#6b7280;cursor:pointer;font-size:11px">清空</a>
        </div>
      </div>

      <!-- Right: chat + issues (tabs) -->
      <div class="chat-pane" style="position:relative">
        <div class="tabs-bar">
          <button class="tab-btn active" id="tabChat" onclick="switchTab('chat')">💬 AI 诊断与方案</button>
          <button class="tab-btn" id="tabIssues" onclick="switchTab('issues')">🎯 问题清单 <span id="issuesCount" class="muted" style="font-size:11px"></span></button>
          <a onclick="viewProjects()" style="margin-left:auto;font-size:12px;color:#6b7280;cursor:pointer;padding:6px">← 返回项目列表</a>
        </div>

        <!-- Chat view -->
        <div class="pane-content" id="paneChat">
          <div class="chat-head">
            <h2>
              <span><span id="curSessionTitle" class="muted" style="font-weight:normal;font-size:12px;margin-left:8px">新对话</span></span>
              <div class="actions">
                <button class="btn btn-sec btn-sm" onclick="newSession()">+ 新对话</button>
                <button class="btn btn-sec btn-sm" onclick="toggleHistory()">📋 历史</button>
              </div>
            </h2>
          </div>
          <div class="chat-msgs" id="chatMsgs"></div>
          <div class="chat-input-wrap">
            <div id="contextHint" class="muted" style="font-size:11px;margin-bottom:6px"></div>
            <div class="chat-input">
              <textarea id="chatInput" placeholder="输入你的问题…（Ctrl/Cmd + Enter 发送）" onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter')sendMsg()"></textarea>
              <button class="btn" onclick="sendMsg()" id="sendBtn">发送</button>
            </div>
          </div>
          <!-- History drawer -->
          <div class="hist-drawer" id="histDrawer">
            <div class="hist-head">
              <b>📋 历史对话</b>
              <a onclick="toggleHistory()" style="cursor:pointer;color:#6b7280">×</a>
            </div>
            <div class="hist-list" id="histList">加载中…</div>
          </div>
        </div>

        <!-- Issues view -->
        <div class="pane-content" id="paneIssues" style="display:none">
          <div class="issues-toolbar">
            <div class="issues-stats" id="issuesStats">—</div>
            <button class="btn btn-sm" onclick="extractFromSelected()" id="extractBtn">🔍 抽取勾选</button>

async function refreshDocs(){
  if(!currentProject) return;
  try{
    const list = await api('/api/documents/by_project/'+currentProject.id);
    const sel = selectedDocs;
    const list_el = document.getElementById('docsList');
    if(!list_el) return;
    if(!list.length){
      list_el.innerHTML = '<div class="muted" style="padding:20px;text-align:center">暂无文档<br>点击右上"+ 上传"添加</div>';
    } else {
      list_el.innerHTML = list.map(d=>{
        const isSel = sel.has(d.id);
        const status = d.parse_status || 'pending';
        const stLabel = {pending:'解析中…',done:'解析完成',failed:'解析失败',unsupported:'格式不支持'}[status]||status;
        const previewable = status==='done';
        return `<div class="doc-row ${isSel?'selected':''}" onclick="toggleDoc(${d.id})">
          <div class="name">
            <input type="checkbox" ${isSel?'checked':''} onclick="event.stopPropagation();toggleDoc(${d.id})">
            <span style="flex:1">${d.filename}</span>
          </div>
          <div class="meta">
            <span><span class="badge ${status}">${stLabel}</span> · ${(d.size_bytes/1024).toFixed(1)} KB</span>
            <span class="muted">${new Date(d.uploaded_at).toLocaleString()}</span>
          </div>
          <div class="acts">
            ${previewable?`<a onclick="event.stopPropagation();previewDoc(${d.id},'${d.filename.replace(/'/g,"")}')">👁 预览</a>`:''}
            <a onclick="event.stopPropagation();reparseDoc(${d.id})">🔄 重新解析</a>
            <a class="danger" onclick="event.stopPropagation();delDoc(${d.id})">🗑 删除</a>
          </div>
        </div>`;
      }).join('');
    }
    document.getElementById('selCount').textContent = sel.size;
    updateContextHint();
  }catch(e){ console.error(e); }
}

function toggleDoc(id){
  if(selectedDocs.has(id)) selectedDocs.delete(id); else selectedDocs.add(id);
  refreshDocs();
}

function updateContextHint(){
  const el = document.getElementById('contextHint');
  if(!el) return;
  if(selectedDocs.size === 0) el.textContent = '⚠️ 当前未勾选文档，AI 仅基于通用知识回答';
  else el.innerHTML = `📎 本次对话将引用 <b style="color:#2563eb">${selectedDocs.size}</b> 份文档作为上下文`;
}

function openUpload(){
  openModal('上传文档', `
    <p class="muted" style="margin-top:0">支持 .docx / .pptx 多选，上传后自动解析（含图片）</p>
    <div class="field"><input type="file" id="upFiles" multiple></div>
    <div class="field"><label>文档类型</label>
      <select id="upKind">
        <option value="orig">未改动（原版）</option>
        <option value="rev">修订</option>
        <option value="new">新增</option>
      </select>
    </div>
    <div id="upProgress"></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button class="btn btn-sec" onclick="closeModal()">关闭</button>
      <button class="btn" onclick="doUpload()">上传</button>
    </div>`);
}
async function doUpload(){
  const files = document.getElementById('upFiles').files;
  if(!files.length){ alert('请至少选择一个文件'); return; }
  const fd = new FormData();
  fd.append('project_id', currentProject.id);
  fd.append('kind', document.getElementById('upKind').value);
  for(const f of files) fd.append('files', f);
  const prog = document.getElementById('upProgress');
  prog.innerHTML = `<p class="muted">⏳ 上传 ${files.length} 个文件…</p>`;
  try{
    const r = await fetch('/api/documents/upload_batch', {method:'POST', body:fd, headers:{'Authorization':'Bearer '+token}});
    const text = await r.text();
    let j; try{ j = JSON.parse(text); } catch(_){ prog.innerHTML='<div class="error">服务器返回非 JSON：'+text.substring(0,300)+'</div>'; return; }
    if(!r.ok){ prog.innerHTML = '<div class="error">'+(j.detail||'失败')+'</div>'; return; }
    const ok = `✅ 成功 ${j.uploaded.length} 个`;
    const fail = j.failed.length ? `<br><span style="color:#dc2626">❌ 失败 ${j.failed.length}：${j.failed.map(x=>x.filename+'('+x.error+')').join(', ')}</span>` : '';
    prog.innerHTML = `<p>${ok}${fail}<br><span class="muted" style="font-size:11px">解析在后台进行，几秒后会自动刷新状态</span></p>`;
    document.getElementById('upFiles').value='';
    await refreshDocs();
  }catch(e){ prog.innerHTML = '<div class="error">'+e.message+'</div>'; }
}

async function previewDoc(id, name){
  openModal('📄 预览：'+name, `<iframe class="preview-frame" id="prevFrame"></iframe>`, true);
  try{
    const htmlContent = await api('/api/documents/'+id+'/preview');
    document.getElementById('prevFrame').srcdoc = htmlContent;

}
async function reparseDoc(id){
  try{ await api('/api/documents/'+id+'/reparse', {method:'POST'}); refreshDocs(); }

}
async function reparseAll(){
  if(!confirm('对所有未完成的文档触发重新解析？')) return;
  try{
    const j = await api('/api/documents/reparse_all/'+currentProject.id, {method:'POST'});
    alert(`已重新排队 ${j.queued} 份文档`);

async function delDoc(id){
  if(!confirm('确认删除该文档？')) return;
  selectedDocs.delete(id);
  try{ await api('/api/documents/'+id, {method:'DELETE'}); refreshDocs(); }
  catch(e){ alert(e.message); }
}

let mermaidSeq = 0;

/** Find all <pre><code class="language-mermaid"> blocks under root, render to SVG. */
async function renderMermaidIn(root){
  if(!window.mermaid) return;
  const blocks = root.querySelectorAll('pre > code.language-mermaid, code.language-mermaid');
  for(const codeEl of blocks){
    const pre = codeEl.parentElement.tagName === 'PRE' ? codeEl.parentElement : codeEl;
    if(pre.dataset.mermaidRendered) continue;
    pre.dataset.mermaidRendered = '1';
    const code = (codeEl.textContent || '').trim();
    const id = 'mmd-' + (++mermaidSeq);
    const wrap = document.createElement('div');
    wrap.className = 'mermaid-wrap';
    wrap.dataset.code = encodeURIComponent(code);
    wrap.innerHTML = `<div class="mermaid-svg" id="${id}"></div>
      <div class="mermaid-actions">
        <a onclick="summarizeChart(this)">📊 AI 总结</a>
        <a onclick="askEditFreeform(this)">✏️ 让 AI 修改</a>
        <a onclick="exportChartPng(this,'${id}')">💾 导出 PNG</a>
        <a onclick="viewChartFull(this)">🔍 大图查看</a>
        <a onclick="copyMermaidCode(this)">📋 复制代码</a>
      </div>`;
    pre.replaceWith(wrap);
    try{
      const { svg } = await mermaid.render(id + '-svg', code);
      document.getElementById(id).innerHTML = svg;
      // Make nodes clickable
      attachNodeClickHandlers(document.getElementById(id), wrap);
    }catch(err){
      document.getElementById(id).innerHTML = `<div class="mermaid-error">⚠️ Mermaid 渲染失败：${escapeHtml(err.message||err)}\n\n代码:\n<code>${escapeHtml(code.substring(0,400))}</code></div>`;
    }
  }
}

function attachNodeClickHandlers(svgWrap, mermaidWrap){
  // Mermaid renders nodes as <g class="node ...">
  const nodes = svgWrap.querySelectorAll('g.node, g.actor');
  nodes.forEach(n=>{
    n.style.cursor = 'pointer';
    n.addEventListener('mouseenter', ()=>{
      n.querySelectorAll('rect,polygon,circle,ellipse,path').forEach(s=>{
        s.style.filter = 'brightness(1.05) drop-shadow(0 0 4px rgba(37,99,235,.6))';
      });
    });
    n.addEventListener('mouseleave', ()=>{
      n.querySelectorAll('rect,polygon,circle,ellipse,path').forEach(s=>{
        s.style.filter = '';
      });
    });
    n.addEventListener('click', (e)=>{
      e.stopPropagation();
      const label = n.querySelector('text')?.textContent || n.textContent.trim().substring(0,40) || '(未知节点)';
      openNodeEditor(mermaidWrap, label);
    });
  });
}

function openNodeEditor(mermaidWrap, nodeLabel){
  const code = decodeURIComponent(mermaidWrap.dataset.code || '');
  mermaidWrap.dataset.editTarget = nodeLabel;
  openModal(`✏️ 编辑节点：${nodeLabel}`, `
    <p class="muted" style="font-size:12px">在下方告诉 AI 你想怎么改这个节点（或它周围的结构）。AI 会读取整张图 + 项目已知问题，给出建议并预览 diff。</p>
    <div class="field"><label>修改要求</label>
      <textarea id="nodeEditInstr" rows="4" placeholder="例：
- 把这个节点拆成"末道报工"和"分段报工"两个子节点
- 在这个节点后面增加一个 IQC 复检步骤
- 将严重度提升到高，并连接到 D1 节点"></textarea>
    </div>
    <div id="nodeEditPrompts" class="prompt-chips" style="margin-bottom:10px"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn btn-sec" onclick="closeModal()">取消</button>
      <button class="btn" onclick="askAIEdit(this)" data-code="${encodeURIComponent(code)}" data-target="${encodeURIComponent(nodeLabel)}">🤖 让 AI 提议</button>
    </div>
    <div id="diffResult"></div>
  `, true);
  // Quick prompt chips
  const promptsEl = document.getElementById('nodeEditPrompts');
  const presets = [
    '在此节点后增加一个 IQC 质检步骤',
    '把此节点拆成 2 个并行子节点',
    '提升此节点为高严重度（红色）',
    '删除此节点并重新连接前后节点',
    '为此节点加一个失败异常分支',
  ];
  promptsEl.innerHTML = presets.map(p=>`<span class="chip" onclick="document.getElementById('nodeEditInstr').value='${p}';document.getElementById('nodeEditInstr').focus()">${p}</span>`).join('');
}

function askEditFreeform(actionEl){

}

async function askAIEdit(btn){
  const code = decodeURIComponent(btn.dataset.code);
  const target = decodeURIComponent(btn.dataset.target);
  const instr = document.getElementById('nodeEditInstr').value.trim();
  if(!instr){ alert('请填写修改要求'); return; }
  btn.disabled = true; btn.textContent = '🤖 AI 思考中…';
  const diffEl = document.getElementById('diffResult');
  diffEl.innerHTML = '<p class="muted" style="margin-top:14px">⏳ AI 正在分析当前图 + 项目已知问题，预计 20~60 秒…</p>';
  try{
    const j = await api('/api/diagrams/edit', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({project_id: currentProject.id, mermaid_code: code,
                            target_node: target==='(整张图)'?null:target,
                            instruction: instr})});
    // Render diff
    await renderDiffPreview(diffEl, code, j.new_mermaid, j.reasoning);
  }catch(e){ diffEl.innerHTML = '<div class="error" style="margin-top:14px">'+e.message+'</div>'; }
  finally{ btn.disabled = false; btn.textContent = '🤖 让 AI 提议'; }
}

async function renderDiffPreview(container, oldCode, newCode, reasoning){
  container.innerHTML = `
    <h4 style="margin:18px 0 8px;font-size:13px;color:#1e40af;border-bottom:1px solid #e5e7eb;padding-bottom:4px">📋 AI 提议预览</h4>
    <div style="background:#fffbeb;border:1px solid #d97706;border-radius:6px;padding:10px 14px;margin:8px 0;font-size:13px">
      <b>说明：</b><br>${marked ? marked.parse(reasoning||'(无)') : escapeHtml(reasoning||'(无)')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
      <div>
        <div style="font-size:11px;color:#6b7280;margin-bottom:4px">⬜ 原图</div>
        <div id="diffOld" style="background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;padding:10px;min-height:200px;text-align:center"></div>
      </div>
      <div>
        <div style="font-size:11px;color:#16a34a;margin-bottom:4px">🟢 AI 建议</div>
        <div id="diffNew" style="background:#f0fdf4;border:1px solid #16a34a;border-radius:6px;padding:10px;min-height:200px;text-align:center"></div>
      </div>
    </div>
    <details style="margin-top:10px"><summary class="muted" style="font-size:11px;cursor:pointer">查看新代码</summary>
      <pre style="background:#1e293b;color:#e2e8f0;padding:10px;border-radius:6px;font-size:11px;overflow:auto;max-height:200px;margin-top:6px">${escapeHtml(newCode)}</pre>
    </details>
    <div class="row" style="justify-content:flex-end;margin-top:14px;gap:8px">
      <button class="btn btn-sec" onclick="document.getElementById('diffResult').innerHTML='';document.getElementById('nodeEditInstr').focus()">↩️ 继续追问</button>
      <button class="btn" style="background:#16a34a" onclick="applyDiff('${encodeURIComponent(newCode)}')">✅ 应用此版本</button>
    </div>`;
  // Render both diagrams
  try{
    const oldR = await mermaid.render('diff-old-svg', oldCode);
    document.getElementById('diffOld').innerHTML = oldR.svg;
  }catch(e){ document.getElementById('diffOld').textContent = '原图渲染失败'; }
  try{
    const newR = await mermaid.render('diff-new-svg', newCode);
    document.getElementById('diffNew').innerHTML = newR.svg;
  }catch(e){ document.getElementById('diffNew').innerHTML = '<div class="error">新图渲染失败：'+escapeHtml(e.message)+'</div>'; }
}

function applyDiff(encNewCode){
  const newCode = decodeURIComponent(encNewCode);
  // Find the mermaid-wrap that was being edited
  const wraps = document.querySelectorAll('.mermaid-wrap[data-edit-target]');
  if(!wraps.length){ alert('找不到原图位置'); return; }
  const wrap = wraps[wraps.length-1];
  delete wrap.dataset.editTarget;
  // Replace with new code + re-render
  wrap.dataset.code = encodeURIComponent(newCode);
  const svgWrap = wrap.querySelector('.mermaid-svg');
  const newId = 'mmd-' + (++mermaidSeq) + '-svg';
  mermaid.render(newId, newCode).then(({svg})=>{
    svgWrap.innerHTML = svg;
    attachNodeClickHandlers(svgWrap, wrap);
  }).catch(e=>{
    svgWrap.innerHTML = '<div class="mermaid-error">新图渲染失败：'+escapeHtml(e.message)+'</div>';
  });
  closeModal();
  // Toast
  const t = document.createElement('div');
  t.style.cssText='position:fixed;top:20px;right:20px;background:#16a34a;color:#fff;padding:10px 16px;border-radius:8px;z-index:100;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15)';
  t.textContent = '✅ 已应用 AI 的新版本';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

function getMermaidCode(actionEl){
  return decodeURIComponent(actionEl.closest('.mermaid-wrap').dataset.code || '');
}

function copyMermaidCode(actionEl){
  const code = getMermaidCode(actionEl);
  navigator.clipboard.writeText(code).then(
    ()=>alert('✅ Mermaid 代码已复制'),
    ()=>alert('复制失败')

function exportChartPng(actionEl, svgWrapId){
  const svgWrap = document.getElementById(svgWrapId);
  const svg = svgWrap.querySelector('svg');
  if(!svg){ alert('图未渲染'); return; }
  // Serialize SVG to data URL
  const xml = new XMLSerializer().serializeToString(svg);
  const svgDataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
  const img = new Image();
  img.onload = ()=>{
    const canvas = document.createElement('canvas');
    const scale = 2; // 2x for crisp
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(blob=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `图表_${Date.now()}.png`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  };
  img.onerror = ()=>alert('SVG 转换失败');
  img.src = svgDataUrl;
}

  const myId = 'm'+(++msgSeq);
  // For assistant: render markdown; for user: keep as plain
  let body;
  if(role==='assistant' && window.marked){
    try{ body = marked.parse(content||''); }
    catch(_){ body = '<p>'+escapeHtml(content)+'</p>'; }
  } else {
    body = escapeHtml(content);
  }
  // Action bar only for assistant
  const actions = role==='assistant' ? `
    <div class="msg-actions">

    `<div class="msg ${cls}" id="${myId}" data-raw="${encodeURIComponent(content||'')}">
       <div class="av">${av}</div>
       <div class="bubble">${body}${refsHtml}${actions}</div>
     </div>`);
  wrap.scrollTop = wrap.scrollHeight;
}

async function sendMsg(){
  const inp = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const txt = inp.value.trim(); if(!txt) return;
  const refDocIds = Array.from(selectedDocs);
  const docRows = document.querySelectorAll('.doc-row.selected .name span:last-child');
  const refNames = Array.from(docRows).map(el=>el.textContent);
  appendMsg('user', txt, refNames);
  inp.value=''; inp.disabled=true; sendBtn.disabled=true;

  const wrap = document.getElementById('chatMsgs');
  // Create assistant bubble we'll stream into
  const myId = 'm'+(++msgSeq);
  wrap.insertAdjacentHTML('beforeend',
    `<div class="msg assistant" id="${myId}" data-raw="">
       <div class="av">AI</div>
       <div class="bubble"><span class="muted streaming-cursor">🤔 思考中…</span></div>
     </div>`);
  wrap.scrollTop = wrap.scrollHeight;
  const bubble = document.querySelector(`#${myId} .bubble`);

  let accumulated = '';
  let firstChunkReceived = false;

  try{
    const r = await fetch('/api/chat', {
      method:'POST',
      headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify({project_id:currentProject.id, message:txt,
                            session_id:currentSession, referenced_doc_ids:refDocIds,
                            stream: true})
    });
    if(!r.ok){
      const e = await r.json().catch(()=>({detail:r.statusText}));
      throw new Error(e.detail||'失败');
    }

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    while(true){
      const {value, done} = await reader.read();
      if(done) break;
      const chunk = decoder.decode(value, {stream:true});

      // First chunk contains session id marker: ​__SID__{id}​
      if(!firstChunkReceived && chunk.includes('__SID__')){
        const m = chunk.match(/​__SID__(\d+)​/);
        if(m){ currentSession = parseInt(m[1]); }
        const cleaned = chunk.replace(/​__SID__\d+​/, '');
        accumulated += cleaned;
      } else {
        accumulated += chunk;
      }
      firstChunkReceived = true;

      // Re-render markdown progressively
      const renderedHtml = (window.marked) ? marked.parse(accumulated) : escapeHtml(accumulated);
      bubble.innerHTML = renderedHtml + '<span class="streaming-cursor"></span>';
      document.getElementById(myId).dataset.raw = encodeURIComponent(accumulated);
      wrap.scrollTop = wrap.scrollHeight;
    }

    // Stream finished: add action buttons + ref tag
    const refsHtml = refNames.length ? `<div class="refs">📎 参考 ${refNames.length} 份：${escapeHtml(refNames.join(', '))}</div>` : '';
    const actions = `<div class="msg-actions">
        <a onclick="openMsgPage('${myId}')">📄 新窗口查看</a>
        <a onclick="downloadMd('${myId}')">📥 下载 .md</a>
        <a onclick="copyMsg('${myId}')">📋 复制</a>
      </div>`;
    const finalHtml = (window.marked) ? marked.parse(accumulated) : escapeHtml(accumulated);
    bubble.innerHTML = finalHtml + refsHtml + actions;
    // Render any Mermaid blocks
    await renderMermaidIn(bubble);
    wrap.scrollTop = wrap.scrollHeight;
    // Refresh session list (new session may have been created)
    if(document.getElementById('histDrawer').classList.contains('open')) refreshSessions();
  }catch(e){
    bubble.innerHTML = '<span style="color:#dc2626">⚠️ '+escapeHtml(e.message)+'</span>';
  }finally{
    inp.disabled=false; sendBtn.disabled=false; inp.focus();
  }
}

async function loadSession(sid){
  currentSession = sid;
  document.getElementById('curSessionTitle').textContent = '· 加载中…';
  try{
    const msgs = await api('/api/chat/session/'+sid+'/messages');
    const wrap = document.getElementById('chatMsgs');
    wrap.innerHTML = '';
    msgSeq = 0;
    for(const m of msgs){
      // parse out "[📎参考: ...]" if present in user msg
      let content = m.content || '';
      let refs = null;
      const refMatch = content.match(/\s*\[📎参考:\s*([^\]]+)\]\s*$/);
      if(refMatch){ refs = refMatch[1].split(/,\s*/); content = content.substring(0, refMatch.index); }
      appendMsg(m.role, content, refs);
    }
    // Render any Mermaid in loaded messages
    await renderMermaidIn(wrap);
    // re-fetch session title
    const sessions = await api('/api/chat/sessions/'+currentProject.id);
    const cur = sessions.find(s=>s.id===sid);
    document.getElementById('curSessionTitle').textContent = cur ? '· '+cur.title : '';
    refreshSessions();
  }catch(e){ alert(e.message); }
}

async function renameSession(sid, currentTitle){

  try{

      headers:{'Content-Type':'application/json'},

async function delSession(sid){

  try{

    refreshSessions();
  }catch(e){ alert(e.message); }
}

  const body = {
    category: ei_cat.value, severity: ei_sev.value,
    title: ei_title.value, description: ei_desc.value,
    proposed_solution: ei_sol.value, required_inputs: ei_req.value,
    status: ei_status.value
  };
  try{
    await api('/api/issues/'+id, {method:'PATCH',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    closeModal(); refreshIssues();
  }catch(e){ alert(e.message); }
}

async function approveIssue(id){
  try{ await api('/api/issues/'+id+'/approve', {method:'POST'}); closeModal(); refreshIssues(); }
  catch(e){ alert(e.message); }
}

async function delIssue(id){
  if(!confirm('确认删除该问题？')) return;
  try{ await api('/api/issues/'+id, {method:'DELETE'}); closeModal(); refreshIssues(); }
  catch(e){ alert(e.message); }
}

function extractFromSelected(){
  if(selectedDocs.size === 0){
    alert('请先在左侧勾选要分析的文档');
    return;
  }
  const n = selectedDocs.size;
  // Get filenames
  const docRows = document.querySelectorAll('.doc-row.selected .name span:last-child');
  const names = Array.from(docRows).map(el=>el.textContent.trim()).slice(0,5);
  const moreCount = n - names.length;
  openModal('🔍 确认抽取问题', `
    <p>将对 <b style="color:#2563eb">${n}</b> 份文档逐一调用 AI 抽取问题，预计耗时 <b>${n*30}~${n*60}</b> 秒。</p>
    <div style="background:#f8fafc;border-radius:6px;padding:10px 14px;margin:10px 0;font-size:12px;max-height:120px;overflow-y:auto">
      <b>勾选的文档：</b><br>
      ${names.map(n=>'• '+escapeHtml(n)).join('<br>')}
      ${moreCount>0?'<br>... 以及其他 '+moreCount+' 份':''}
    </div>
    <p class="muted" style="font-size:12px;margin:8px 0">⚠️ 现有 AI 草案问题会保留。如需替换，请先手动删除。</p>
    <p class="muted" style="font-size:12px">⚠️ 仅对"解析完成"的文档生效，未解析的会被跳过。</p>
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn btn-sec" onclick="closeModal()">取消</button>
      <button class="btn" onclick="confirmExtract()">▶ 开始抽取</button>
    </div>
  `);
}

async function extractAllDocs(){
  // Get all done docs in project
  try{
    const docs = await api('/api/documents/by_project/'+currentProject.id);
    const doneDocs = docs.filter(d=>d.parse_status==='done');
    if(!doneDocs.length){ alert('没有已解析完成的文档'); return; }
    const n = doneDocs.length;
    openModal('⚡ 抽取全部已解析文档', `
      <p>将对 <b style="color:#7c3aed">${n}</b> 份已解析完成的文档逐一调用 AI 抽取问题。</p>
      <p class="muted" style="font-size:12px">预计耗时 <b>${Math.round(n*30/60)}~${Math.round(n*60/60)}</b> 分钟，可关闭浏览器，结果会在后台继续生成。</p>
      <p class="muted" style="font-size:12px">⚠️ 现有 AI 草案问题会保留。</p>
      <div class="row" style="justify-content:flex-end;margin-top:14px">
        <button class="btn btn-sec" onclick="closeModal()">取消</button>
        <button class="btn" style="background:#7c3aed" onclick="confirmExtractAll(${JSON.stringify(doneDocs.map(d=>d.id))})">▶ 开始抽取 ${n} 份</button>
      </div>
    `);
  }catch(e){ alert(e.message); }
}

async function confirmExtractAll(docIds){
  closeModal();
  const btn = document.getElementById('extractAllBtn');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ 排队中…'; }
  try{
    const j = await api('/api/issues/extract', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({project_id: currentProject.id, doc_ids: docIds, replace_existing: false})});
    if(btn) btn.textContent = `⏳ 处理 ${j.queued} 份…`;
    const stats = document.getElementById('issuesStats');
    if(stats){ stats.innerHTML = `⏳ 后台抽取 <b>${j.queued}</b> 份文档，预计 ${Math.round(j.queued*30/60)}~${Math.round(j.queued*60/60)} 分钟…`; }
    setTimeout(()=>{ if(btn){ btn.disabled = false; btn.textContent = '⚡ 抽取全部已解析'; } }, j.queued*5000);
  }catch(e){
    alert(e.message); if(btn){ btn.disabled = false; btn.textContent = '⚡ 抽取全部已解析'; }
  }
}

async function confirmExtract(){
  const docIds = Array.from(selectedDocs);
  closeModal();
  const btn = document.getElementById('extractBtn');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ 排队中…'; }
  try{
    const j = await api('/api/issues/extract', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({project_id: currentProject.id, doc_ids: docIds, replace_existing: false})});
    if(btn) btn.textContent = `⏳ 处理中 (${j.queued} 份)…`;
    // Hint user
    const stats = document.getElementById('issuesStats');
    if(stats){
      stats.innerHTML = `⏳ 后台正在处理 <b>${j.queued}</b> 份文档，预计 ${j.queued*30}~${j.queued*60} 秒。页面会自动刷新…`;
    }
    setTimeout(()=>{
      if(btn){ btn.disabled = false; btn.textContent = '🔍 从勾选文档抽取'; }
    }, j.queued*5000);
    refreshIssues();
  }catch(e){
    alert(e.message);
    if(btn){ btn.disabled = false; btn.textContent = '🔍 从勾选文档抽取'; }
  }
}

/* ============ Users (admin) ============ */
async function viewUsers(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="page">
    <h1>用户管理</h1>
    <div class="row" style="margin-bottom:14px"><button class="btn" onclick="newUser()">+ 新建用户</button></div>
    <div class="card"><table><thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>邮箱</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="userTbody"></tbody></table></div>
  </div>`;
  try{
    const list = await api('/api/users');
    const meId = user.id;
    document.getElementById('userTbody').innerHTML = list.map(u=>{
      const delBtn = u.id !== meId
        ? `<button class="btn btn-sec btn-sm" onclick="delUser(${u.id})" style="color:#dc2626">删除</button>` : '';
      return `<tr><td>${u.id}</td><td><b>${u.username}</b></td><td>${u.full_name||'-'}</td><td class="muted">${u.email||'-'}</td>
        <td><span class="badge ${u.role}">${u.role}</span></td>
        <td>${u.is_active?'✅启用':'❌禁用'}</td>
        <td><button class="btn btn-sec btn-sm" onclick="editUser(${u.id})">编辑</button> ${delBtn}</td></tr>`;
    }).join('');
  }catch(e){ main.innerHTML += '<div class="error">'+e.message+'</div>'; }
}
function newUser(){
  openModal('新建用户', `
    <div class="field"><label>用户名</label><input id="nu_username"></div>
    <div class="field"><label>密码</label><input id="nu_password" type="password"></div>
    <div class="field"><label>姓名</label><input id="nu_fullname"></div>
    <div class="field"><label>邮箱</label><input id="nu_email"></div>
    <div class="field"><label>角色</label><select id="nu_role">
      <option value="engineer">engineer（工程师）</option>
      <option value="admin">admin（管理员）</option>
      <option value="viewer">viewer（只读）</option>
    </select></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn btn-sec" onclick="closeModal()">取消</button>
      <button class="btn" onclick="submitUser()">创建</button>
    </div>`);
}
async function submitUser(){
  try{
    await api('/api/users', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:nu_username.value, password:nu_password.value,
        full_name:nu_fullname.value, email:nu_email.value, role:nu_role.value})});
    closeModal(); viewUsers();
  }catch(e){ alert(e.message); }
}
async function editUser(id){
  const list = await api('/api/users'); const u = list.find(x=>x.id===id);
  openModal('编辑用户 — '+u.username, `
    <div class="field"><label>姓名</label><input id="eu_fullname" value="${u.full_name||''}"></div>
    <div class="field"><label>邮箱</label><input id="eu_email" value="${u.email||''}"></div>
    <div class="field"><label>角色</label><select id="eu_role">
      <option value="engineer" ${u.role==='engineer'?'selected':''}>engineer</option>
      <option value="admin" ${u.role==='admin'?'selected':''}>admin</option>
      <option value="viewer" ${u.role==='viewer'?'selected':''}>viewer</option>
    </select></div>
    <div class="field"><label>状态</label><select id="eu_active">
      <option value="true" ${u.is_active?'selected':''}>启用</option>
      <option value="false" ${!u.is_active?'selected':''}>禁用</option>
    </select></div>
    <div class="field"><label>新密码（留空不改）</label><input id="eu_pwd" type="password"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn btn-sec" onclick="closeModal()">取消</button>
      <button class="btn" onclick="submitEditUser(${id})">保存</button>
    </div>`);
}
async function submitEditUser(id){
  const body = {full_name:eu_fullname.value, email:eu_email.value, role:eu_role.value, is_active:eu_active.value==='true'};
  if(eu_pwd.value) body.password = eu_pwd.value;
  try{
    await api('/api/users/'+id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    closeModal(); viewUsers();
  }catch(e){ alert(e.message); }
}
async function delUser(id){
  if(!confirm('确认删除该用户？')) return;
  try{ await api('/api/users/'+id,{method:'DELETE'}); viewUsers(); }
  catch(e){ alert(e.message); }
}

/* ============ Health + Settings ============ */
async function viewHealth(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="page">
    <h1>系统状态</h1>
    <div class="card" id="hc">检查中…</div>
    <div class="card" id="cfg">加载配置…</div>
  </div>`;
  try{
    const app_h = await api('/api/health');
    const llm_h = await api('/api/chat/health');
    let errBox = '';
    if(!llm_h.ok && llm_h.error){
      errBox = `<div style="background:#fee2e2;border:1px solid #dc2626;border-radius:8px;padding:10px 14px;margin-top:10px;font-family:monospace;font-size:12px;color:#991b1b;white-space:pre-wrap;word-break:break-all">❌ 错误详情：<br>${escapeHtml(llm_h.error||'')}</div>`;
    }
    document.getElementById('hc').innerHTML = `
      <h2 style="margin-top:0">系统健康</h2>
      <p>应用状态：<b>${app_h.status}</b> · 环境：${app_h.env}</p>
      <p>MiniMax 连通性：<b style="color:${llm_h.ok?'#16a34a':'#dc2626'};font-size:15px">${llm_h.ok?'✅ 正常':'❌ 失败'}</b></p>
      <p>当前模型：<code>${llm_h.model||'-'}</code></p>
      <p>端点：<code>${llm_h.base_url||'-'}</code></p>
      ${llm_h.ok?`<p>测试返回：<span class="muted">${llm_h.sample||'-'}</span></p>`:''}
      ${errBox}
      <button class="btn btn-sec btn-sm" onclick="viewHealth()" style="margin-top:8px">🔄 重新检测</button>
    `;
    const s = await api('/api/settings');
    document.getElementById('cfg').innerHTML = `
      <h2 style="margin-top:0">大模型配置（仅管理员）</h2>
      <p class="muted" style="font-size:12px">修改后立即生效，覆盖 .env 文件设置。</p>
      <div class="field"><label>API Key（当前：${s.minimax_api_key_preview}）</label>
        <input id="cfg_key" placeholder="留空表示不修改" type="password"></div>
      <div class="field"><label>模型名</label><input id="cfg_model" value="${s.minimax_model}"></div>
      <div class="field"><label>Base URL</label><input id="cfg_base" value="${s.minimax_base_url}"></div>
      <div class="field"><label>最大 tokens</label><input id="cfg_max" type="number" value="${s.minimax_max_tokens}"></div>
      <div class="row" style="margin-top:6px">
        <button class="btn" onclick="saveSettings()">💾 保存</button>
        <button class="btn btn-sec" onclick="testAfterSave()">💾 保存并立即测试</button>
        <span id="cfgMsg" class="muted"></span>
      </div>
    `;
  }catch(e){ document.getElementById('hc').innerHTML = '<div class="error">'+e.message+'</div>'; }
}
async function saveSettings(){
  const body = {minimax_model:cfg_model.value.trim(),minimax_base_url:cfg_base.value.trim(),minimax_max_tokens:parseInt(cfg_max.value)||4096};
  if(cfg_key.value.trim()) body.minimax_api_key = cfg_key.value.trim();
  try{
    await api('/api/settings', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    cfgMsg.innerHTML = '<span style="color:#16a34a">✅ 已保存</span>';
    cfg_key.value = '';
  }catch(e){ cfgMsg.innerHTML = '<span style="color:#dc2626">❌ '+e.message+'</span>'; }
}
async function testAfterSave(){ await saveSettings(); setTimeout(viewHealth, 600); }

function render(view){
  if(view==='projects') viewProjects();
  else if(view==='users') viewUsers();
  else if(view==='health') viewHealth();
}
render('projects');
</script>
