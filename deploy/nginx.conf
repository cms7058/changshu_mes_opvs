# Nginx reverse proxy for MES Agent
# Save to /etc/nginx/conf.d/mes-agent.conf

server {
    listen 80;
    server_name _;  # 改成你的域名，例如 mes.example.com

    client_max_body_size 25M;

    # 推荐之后申请证书后启用 HTTPS：certbot --nginx -d your-domain
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/your-domain/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;     # for long LLM calls
        proxy_send_timeout 600s;
        proxy_buffering off;          # for SSE / streaming
    }
}
